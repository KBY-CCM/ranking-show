<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랭킹 맞추기 쇼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF8EC;
    --panel: #FFFFFF;
    --panel-soft: #FDEEDA;
    --panel-deep: #FFFCF6;
    --cream: #3E2E22;
    --cream-dim: #8A7360;
    --gold: #F2B93C;
    --gold-deep: #B9812A;
    --terracotta: #C24F45;
    --mint: #3F8F68;
    --line: rgba(62,46,34,0.12);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(242,185,60,0.14), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(194,79,69,0.10), transparent 45%),
      var(--bg);
    color:var(--cream);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .app{
    max-width:1080px;
    margin:0 auto;
  }
  header.top{
    text-align:center;
    margin-bottom:22px;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.14em;
    color:var(--gold-deep);
    text-transform:uppercase;
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .paw{width:15px;height:15px;fill:var(--gold-deep);display:inline-block;}
  h1{
    font-family:'Noto Sans KR', sans-serif; font-weight:900;
    font-size:clamp(26px,4.5vw,40px);
    margin:0 0 10px;
  }
  header.top p{
    color:var(--cream-dim);
    font-size:14px;
    line-height:1.7;
    max-width:560px;
    margin:0 auto;
  }

  /* ---------- TABS ---------- */
  .tab-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:22px 0 26px;
    flex-wrap:wrap;
  }
  .tab-btn{
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-size:15px;
    background:var(--panel);
    color:var(--cream-dim);
    border:1px solid var(--line);
    padding:12px 26px;
    border-radius:99px;
    cursor:pointer;
    transition:transform .15s, border-color .15s, background .15s, color .15s, box-shadow .15s;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .tab-btn:hover{ transform:translateY(-2px); }
  .tab-btn.active{
    background:linear-gradient(120deg, var(--gold-deep), var(--gold));
    color:#2A211C;
    border-color:transparent;
    box-shadow:0 8px 18px rgba(185,129,42,0.25);
  }
  .tab-btn .tab-icon{ font-size:16px; }

  .layout{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--panel-deep);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    position:sticky;
    top:16px;
    box-shadow:0 10px 30px rgba(62,46,34,0.08);
  }
  .sidebar-head{
    background:linear-gradient(120deg, var(--gold-deep), var(--gold));
    color:#2A211C;
    padding:14px 16px;
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-head .badge{
    background:rgba(42,33,28,0.15);
    padding:3px 10px;
    border-radius:99px;
    font-size:11px;
    font-family:'Noto Sans KR', sans-serif;
  }
  .rank-list{
    max-height:640px;
    overflow-y:auto;
  }
  .rank-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .rank-row.active{
    background:rgba(242,185,60,0.14);
    box-shadow:inset 3px 0 0 var(--gold-deep);
  }
  .rank-row .rnum{
    width:26px;
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-size:14px;
    color:var(--cream-dim);
    flex:0 0 auto;
    text-align:center;
  }
  .rank-row.active .rnum,
  .rank-row.solved .rnum{ color:var(--gold-deep); }
  .rank-row .content{
    flex:1;
    min-width:0;
  }
  .rank-row .content.with-img{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .rank-row .content-text{
    flex:1;
    min-width:0;
  }
  .item-img{
    width:34px;
    height:34px;
    border-radius:9px;
    object-fit:cover;
    flex:0 0 auto;
    box-shadow:0 2px 6px rgba(62,46,34,0.15);
  }
  .rank-row .placeholder{
    height:20px;
    border-radius:8px;
    background:linear-gradient(90deg, var(--panel-soft) 25%, var(--panel) 50%, var(--panel-soft) 75%);
    background-size:200% 100%;
    animation:shimmer 1.6s infinite;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }
  .rank-row .solved-name{
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-size:14px;
    color:var(--cream);
  }
  .rank-row .pct{
    font-size:11px;
    color:var(--mint);
    margin-left:6px;
  }
  .rank-row .tie{
    font-size:10px;
    color:var(--terracotta);
    display:block;
    margin-top:1px;
  }
  .rank-row .picking{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--gold-deep);
    font-size:12px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--terracotta);
    animation:pulse 1s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.4;transform:scale(.7);}
  }
  .rank-row.known .solved-name{ color:var(--cream-dim); }
  .rank-divider{
    padding:8px 14px;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--cream-dim);
    background:var(--panel);
    text-transform:uppercase;
  }

  /* ---------- MAIN ---------- */
  .main-card{
    background:var(--panel-deep);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 10px 30px rgba(62,46,34,0.08);
  }
  .question-head{
    background:linear-gradient(120deg, #C77B4A, var(--gold));
    color:#2A211C;
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .question-head h2{
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-size:clamp(20px,3vw,28px);
    margin:0;
  }
  .question-head .tie-note{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px;
    font-weight:normal;
    margin-top:4px;
    opacity:.75;
  }
  .hint-pill{
    background:rgba(42,33,28,0.18);
    padding:6px 14px;
    border-radius:99px;
    font-size:12px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  .candidates{
    padding:26px 24px 10px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:14px;
  }
  .candidate-btn{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-size:16px;
    background:var(--panel-soft);
    border:2px solid var(--line);
    color:var(--cream);
    padding:12px 12px 16px;
    border-radius:16px;
    cursor:pointer;
    text-align:center;
    transition:transform .15s, border-color .15s, background .15s, box-shadow .15s;
  }
  .item-img-lg{
    width:76px;
    height:76px;
    margin:0 auto;
    border-radius:14px;
    object-fit:cover;
    box-shadow:0 4px 10px rgba(62,46,34,0.15);
  }
  .item-label{
    line-height:1.3;
  }
  .candidate-btn.marked-wrong{
    border-color:var(--terracotta);
    background:rgba(194,79,69,0.08);
    opacity:.75;
  }
  .mark-badge{
    position:absolute;
    top:-10px;
    right:-10px;
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:900;
    background:var(--panel);
    box-shadow:0 4px 10px rgba(62,46,34,0.18);
    animation:markPop .25s ease-out;
  }
  .mark-badge.correct{ color:var(--mint); border:2px solid var(--mint); }
  .mark-badge.wrong{ color:var(--terracotta); border:2px solid var(--terracotta); }
  @keyframes markPop{
    0%{ transform:scale(0); opacity:0; }
    70%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); }
  }
  .candidate-btn:hover{
    transform:translateY(-3px);
    border-color:var(--gold);
    box-shadow:0 8px 18px rgba(62,46,34,0.12);
  }
  .candidate-btn:active{ transform:translateY(0); }
  .candidate-btn.wrong{
    animation:shake .4s;
    border-color:var(--terracotta);
    background:rgba(194,79,69,0.14);
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .candidate-btn.correct-flash{
    border-color:var(--gold);
    background:rgba(242,185,60,0.22);
  }

  .feedback{
    text-align:center;
    min-height:24px;
    font-size:14px;
    color:var(--cream-dim);
    padding:10px 20px 4px;
  }

  .stats-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    padding:6px 20px 24px;
  }
  .stat-pill{
    font-size:12px;
    color:var(--cream-dim);
    background:var(--panel);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:99px;
  }
  .stat-pill strong{
    color:var(--gold-deep);
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    font-weight:normal;
    margin:0 2px;
  }

  .win-banner{
    display:none;
    text-align:center;
    margin:0 20px 26px;
    padding:26px;
    border-radius:var(--radius);
    background:linear-gradient(135deg, rgba(242,185,60,0.20), rgba(194,79,69,0.10));
    border:1px solid var(--gold-deep);
  }
  .win-banner.show{display:block;}
  .win-banner h2{
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    color:var(--gold-deep);
    margin:0 0 8px;
    font-size:22px;
  }
  .win-banner p{
    color:var(--cream-dim);
    font-size:14px;
    margin:0 0 16px;
  }
  .win-banner .big-num{
    display:inline-block;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:44px;
    line-height:1;
    color:var(--gold-deep);
    margin:0 4px;
    vertical-align:-6px;
  }
  .reset-btn{
    font-family:'Noto Sans KR', sans-serif; font-weight:700;
    background:transparent;
    border:1px solid var(--gold-deep);
    color:var(--gold-deep);
    padding:10px 24px;
    border-radius:99px;
    cursor:pointer;
    font-size:14px;
  }

  footer{
    text-align:center;
    margin-top:32px;
    font-size:12px;
    color:var(--cream-dim);
    opacity:.6;
    line-height:1.8;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="eyebrow">
      <svg class="paw" viewBox="0 0 64 64"><ellipse cx="32" cy="40" rx="16" ry="13"/><ellipse cx="12" cy="20" rx="7" ry="9"/><ellipse cx="52" cy="20" rx="7" ry="9"/><ellipse cx="22" cy="10" rx="6" ry="8"/><ellipse cx="42" cy="10" rx="6" ry="8"/></svg>
      랭킹 맞추기 쇼
    </div>
    <h1 id="pageTitle">가장 흔한 강아지 이름</h1>
    <p id="pageSubtitle"></p>
  </header>

  <div class="tab-bar" id="tabBar"></div>

  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <span id="sidebarTitle">🏆 랭킹 맞혀 보기</span> <span class="badge" id="sidebarBadge">0 / 10</span>
      </div>
      <div class="rank-list" id="rankList"></div>
    </aside>

    <!-- MAIN -->
    <main class="main-card">
      <div class="question-head" id="questionHead">
        <h2 id="questionTitle">1위는 뭘까?<span class="tie-note" id="questionTie"></span></h2>
        <div class="hint-pill">💡 클릭하여 선택</div>
      </div>

      <div class="candidates" id="candidates"></div>
      <div class="feedback" id="feedback"></div>
      <div class="stats-bar">
        <div class="stat-pill">총 시도 <strong id="attemptCount">0</strong>번</div>
        <div class="stat-pill">한 번에 맞춘 개수 <strong id="firstTryCount">0</strong> / <span id="firstTryTotal">10</span></div>
      </div>

      <div class="win-banner" id="winBanner">
        <h2>🐾 완성! 모든 순위를 맞혔어요</h2>
        <p id="winSummary"></p>
        <button class="reset-btn" id="resetBtn">다시 도전하기</button>
      </div>
    </main>
  </div>

  <footer>
    <div id="sourceLine"></div>
  </footer>
</div>

let activeGameKey = 'dog';

function fmtPct(n){
  if(n === undefined || n === null) return '';
  return n + '%';
}

// assign rank labels with tie support ("공동 N위") based on position + equal pct
function assignRanks(list, startRank){
  const withRank = list.map((item,i) => ({...item, rank:startRank+i, tie:false}));
  for(let i=0;i<withRank.length;i++){
    if(i>0 && withRank[i].pct !== undefined && withRank[i].pct === withRank[i-1].pct){
      withRank[i].rank = withRank[i-1].rank;
      withRank[i].tie = true;
      withRank[i-1].tie = true;
    }
  }
  return withRank;
}

// build runtime data + state for every game once
Object.keys(GAMES).forEach(key => {
  const g = GAMES[key];
  g.HIDDEN = assignRanks(g.hiddenRaw, g.hiddenStart);
  g.KNOWN = assignRanks(g.knownRaw, g.knownStart);
  g.state = null; // set by initGame
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function initGame(key){
  const g = GAMES[key];
  g.state = {
    // 10위(가장 마지막 인덱스)부터 시작해서 1위(인덱스 0)로 내려가는 순서
    order: g.HIDDEN.map((_, i) => i).reverse(),
    orderPos: 0,
    pool: shuffle(g.HIDDEN.map(d => ({...d}))),
    revealed: new Array(g.HIDDEN.length).fill(null),
    wrongSet: new Set(), // 이번 문제에서 틀린 후보 이름들 (X 표시 유지용)
    locked: false,
    attemptCount: 0,
    firstTryScore: 0,
  };
}

function curIdx(s){ return s.order[s.orderPos]; }

// ---------------- SOUND ----------------
let audioCtx;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  return audioCtx;
}
function playCorrectSound(){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    // 도-미-솔 "딩동댕~" (마지막 음은 길게 여운)
    const notes = [
      { freq: 523.25, dur: 0.28 },  // C5 딩
      { freq: 659.25, dur: 0.28 },  // E5 동
      { freq: 783.99, dur: 0.9 },   // G5 댕~
    ];
    notes.forEach((n, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.freq;
      const t0 = now + i*0.16;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + n.dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + n.dur + 0.02);
    });
  }catch(e){ /* 오디오 사용 불가 시 무시 */ }
}
function playWrongSound(){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    // 낮은 버저 "삡"
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 165;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.036, now + 0.01);
    gain.gain.setValueAtTime(0.036, now + 0.22);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.32);
  }catch(e){ /* 오디오 사용 불가 시 무시 */ }
}

Object.keys(GAMES).forEach(key => initGame(key));

function currentGame(){ return GAMES[activeGameKey]; }
function getImg(key, name){
  const g = IMAGES[key];
  return g ? (g[name] || null) : null;
}

// ---------------- TAB BAR ----------------
function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  Object.keys(GAMES).forEach(key => {
    const g = GAMES[key];
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === activeGameKey ? ' active' : '');
    btn.innerHTML = `<span class="tab-icon">${g.icon}</span> ${g.label}`;
    btn.addEventListener('click', () => switchGame(key));
    bar.appendChild(btn);
  });
}

function switchGame(key){
  if(key === activeGameKey) return;
  activeGameKey = key;
  renderAll();
}

// ---------------- SIDEBAR ----------------
function renderSidebar(){
  const g = currentGame();
  const s = g.state;
  const list = document.getElementById('rankList');
  list.innerHTML = '';

  for(let i=0;i<g.HIDDEN.length;i++){
    const row = document.createElement('div');
    const isActive = (i === curIdx(s) && !s.revealed[i]);
    const isSolved = !!s.revealed[i];
    row.className = 'rank-row' + (isActive ? ' active' : '') + (isSolved ? ' solved' : '');

    const rnum = document.createElement('div');
    rnum.className = 'rnum';
    rnum.textContent = g.HIDDEN[i].rank;
    row.appendChild(rnum);

    const content = document.createElement('div');
    content.className = 'content';

    if(isSolved){
      const r = s.revealed[i];
      const img = getImg(activeGameKey, r.name);
      const imgHtml = img ? `<img class="item-img" src="${img}" alt="${r.name}">` : '';
      content.innerHTML = `${imgHtml}<div class="content-text"><span class="solved-name">${r.name}</span>${r.pct !== undefined ? `<span class="pct">${fmtPct(r.pct)}</span>` : ''}${r.tie ? `<span class="tie">공동 ${r.rank}위</span>` : ''}</div>`;
      content.classList.add('with-img');
    } else if(isActive){
      content.innerHTML = `<span class="picking"><span class="dot"></span> 고르는 중...</span>`;
    } else {
      content.innerHTML = `<div class="placeholder"></div>`;
    }
    row.appendChild(content);
    list.appendChild(row);
  }

  const div = document.createElement('div');
  div.className = 'rank-divider';
  const knownFirst = g.KNOWN[0].rank;
  const knownLast = g.KNOWN[g.KNOWN.length-1].rank;
  div.textContent = `${knownFirst}위 – ${knownLast}위 (공개됨)`;
  list.appendChild(div);

  g.KNOWN.forEach(k => {
    const row = document.createElement('div');
    row.className = 'rank-row known';
    const img = getImg(activeGameKey, k.name);
    const imgHtml = img ? `<img class="item-img" src="${img}" alt="${k.name}">` : '';
    row.innerHTML = `
      <div class="rnum">${k.rank}</div>
      <div class="content with-img">
        ${imgHtml}
        <div class="content-text">
          <span class="solved-name">${k.name}</span>${k.pct !== undefined ? `<span class="pct">${fmtPct(k.pct)}</span>` : ''}
          ${k.tie ? `<span class="tie">공동 ${k.rank}위</span>` : ''}
        </div>
      </div>`;
    list.appendChild(row);
  });

  document.getElementById('sidebarTitle').textContent = g.sidebarTitle;
  document.getElementById('sidebarBadge').textContent = `${s.revealed.filter(Boolean).length} / ${g.HIDDEN.length}`;
}

    const img = getImg(activeGameKey, item.name);
    if(img){
      const imgEl = document.createElement('img');
      imgEl.className = 'item-img-lg';
      imgEl.src = img;
      imgEl.alt = item.name;
      btn.appendChild(imgEl);
    }
    const label = document.createElement('span');
    label.className = 'item-label';
    label.textContent = item.name;
    btn.appendChild(label);
    if(wasWrong){
      const mark = document.createElement('span');
      mark.className = 'mark-badge wrong';
      mark.textContent = '✕';
      btn.appendChild(mark);
    }
    btn.addEventListener('click', () => handleGuess(item, btn));
    candWrap.appendChild(btn);
  });

  document.getElementById('attemptCount').textContent = s.attemptCount;
  document.getElementById('firstTryCount').textContent = s.firstTryScore;
}

function handleGuess(item, btnEl){
  const g = currentGame();
  const s = g.state;
  if(s.locked) return;

  const idx = curIdx(s);
  const target = g.HIDDEN[idx];
  const isCorrect = target.pct !== undefined
    ? (item.pct === target.pct)
    : (item.name === target.name);

  s.attemptCount++;
  document.getElementById('attemptCount').textContent = s.attemptCount;

  if(isCorrect){
    s.locked = true;
    const mark = document.createElement('span');
    mark.className = 'mark-badge correct';
    mark.textContent = '○';
    btnEl.appendChild(mark);
    btnEl.classList.add('correct-flash');
    playCorrectSound();

    if(s.wrongSet.size === 0){
      s.firstTryScore++;
      document.getElementById('firstTryCount').textContent = s.firstTryScore;
    }
    s.revealed[idx] = item;
    s.pool = s.pool.filter(p => p !== item);
    document.getElementById('feedback').textContent = `정답이에요! ${item.name}` + (item.pct !== undefined ? ` · ${fmtPct(item.pct)}` : '');

    setTimeout(() => {
      s.wrongSet.clear();
      s.orderPos++;
      s.locked = false;
      renderSidebar();
      renderQuestion();
    }, 600);
  } else {
    s.wrongSet.add(item.name);
    const mark = document.createElement('span');
    mark.className = 'mark-badge wrong';
    mark.textContent = '✕';
    btnEl.appendChild(mark);
    btnEl.classList.add('marked-wrong');
    btnEl.classList.add('wrong');
    playWrongSound();
    document.getElementById('feedback').textContent = '앗, 틀렸어요. 다시 골라보세요!';
    setTimeout(() => btnEl.classList.remove('wrong'), 400);
  }
}

function showWin(){
  const g = currentGame();
  const s = g.state;
  const banner = document.getElementById('winBanner');
  banner.classList.add('show');
  const total = g.HIDDEN.length;
  const perfect = (s.firstTryScore === total);
  let summary = `총 <span class="big-num">${s.attemptCount}</span>번 시도해서 완성했어요.`;
  summary += perfect
    ? ` ${total}개 전부 한 번에 맞혔어요! 완벽해요 🏆`
    : ` 한 번에 맞춘 자리는 ${total}개 중 ${s.firstTryScore}개예요.`;
  document.getElementById('winSummary').innerHTML = summary;
}

document.getElementById('resetBtn').addEventListener('click', () => {
  initGame(activeGameKey);
  renderAll();
});

// ---------------- MASTER RENDER ----------------
function renderAll(){
  const g = currentGame();
  document.getElementById('pageTitle').textContent = g.title;
  document.getElementById('pageSubtitle').innerHTML = g.subtitle;
  document.getElementById('sourceLine').textContent = `${g.label} 정보 출처: ${g.source}`;
  renderTabs();
  renderSidebar();
  renderQuestion();
}

renderAll();
</script>
